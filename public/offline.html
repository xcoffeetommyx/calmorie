<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3d7558" />
    <title>Calmorie — You're offline</title>
    <style>
      /* All styles inline — no external resources load offline */

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --brand:       #3d7558;
        --brand-dark:  #2e5d44;
        --brand-light: #d6eadb;
        --bg:          #faf9f7;
        --surface:     #ffffff;
        --text:        #17130f;
        --text-muted:  #7c746b;
        --border:      #ebe8e2;
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-top:    env(safe-area-inset-top, 0px);
      }

      html {
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        padding-top: calc(2rem + var(--safe-top));
        padding-bottom: calc(2rem + var(--safe-bottom));
        text-align: center;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Brand wordmark */
      .brand {
        position: absolute;
        top: calc(1.25rem + var(--safe-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.9375rem;
        font-weight: 700;
        color: var(--brand);
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      /* Offline icon container */
      .icon-wrap {
        width: 80px;
        height: 80px;
        background: var(--brand-light);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.2;
        margin-bottom: 0.625rem;
      }

      .subtitle {
        font-size: 0.9375rem;
        color: var(--text-muted);
        line-height: 1.6;
        max-width: 280px;
        margin: 0 auto 2rem;
      }

      /* Primary retry button */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        height: 48px;
        padding: 0 1.75rem;
        background: var(--brand);
        color: #ffffff;
        border: none;
        border-radius: 9999px;
        font-family: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        transition: background 180ms, transform 100ms;
        text-decoration: none;
      }
      .btn:hover  { background: var(--brand-dark); }
      .btn:active { transform: scale(0.97); }

      /* What works offline card */
      .card {
        margin-top: 2rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1rem 1.25rem;
        max-width: 288px;
        text-align: left;
        width: 100%;
      }

      .card-label {
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--brand);
        margin-bottom: 0.625rem;
      }

      .feature-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        list-style: none;
      }

      .feature-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        color: var(--text-muted);
        line-height: 1.4;
      }

      .feature-list li::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--brand);
        opacity: 0.6;
        flex-shrink: 0;
      }

      /* Footer */
      .footer {
        position: absolute;
        bottom: calc(1.25rem + var(--safe-bottom));
        font-size: 0.6875rem;
        color: #bab3aa;
        letter-spacing: 0.01em;
      }
    </style>
  </head>

  <body>
    <!-- Brand mark -->
    <span class="brand" aria-label="Calmorie">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 2C8 2 4.5 5.5 4.5 9.5c0 5.25 7.5 12.5 7.5 12.5s7.5-7.25 7.5-12.5C19.5 5.5 16 2 12 2z"
          fill="currentColor" opacity="0.25"
        />
        <path
          d="M12 5.5c-2.2 0-4 1.8-4 4 0 2.9 4 7.5 4 7.5s4-4.6 4-7.5c0-2.2-1.8-4-4-4z"
          fill="currentColor"
        />
      </svg>
      Calmorie
    </span>

    <!-- Wifi-off icon -->
    <div class="icon-wrap" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#3d7558"
           stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" opacity="0.35" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" opacity="0.5" />
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" opacity="0.5" />
        <path d="M5 12.85A10 10 0 0 1 9.58 10" />
        <circle cx="12" cy="20" r="1" fill="#3d7558" stroke="none" />
      </svg>
    </div>

    <h1>You&rsquo;re offline</h1>
    <p class="subtitle">
      No connection right now. Your data is safe on-device and most of the app still works.
    </p>

    <button class="btn" onclick="window.location.reload()" aria-label="Try reconnecting">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.25" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
      </svg>
      Try again
    </button>

    <!-- What still works offline -->
    <div class="card" role="note">
      <p class="card-label">Still available offline</p>
      <ul class="feature-list">
        <li>Log meals and calories</li>
        <li>Complete your daily check-in</li>
        <li>Read lessons you&rsquo;ve already opened</li>
        <li>View your food history</li>
      </ul>
    </div>

    <p class="footer" aria-hidden="true">Calmorie &middot; Offline &middot; v0.1</p>
  </body>
</html>
